name: CI

# ============================================================
# EduAgent-Platform 持续集成流水线
# ============================================================
# 触发：main 分支 push / Pull Request
# 阶段：
#   1. lint      —— ruff check（宽松规则集，与 pyproject.toml 一致）
#   2. test      —— pytest + 覆盖率（MockLLM/哈希回退，无 GPU/API Key 依赖）
#   3. build     —— Docker 镜像构建（验证 Dockerfile 可用）
#   4. security  —— 基础安全扫描（ruff + pip-audit）
# ============================================================

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

# 同分支并发时取消旧任务，节省 CI 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff check
        run: ruff check app

      - name: Run ruff format --check
        run: ruff format app --check

  test:
    name: Test & Coverage (pytest)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    env:
      # CI 环境变量：保证 MockLLM/SQLite 回退路径生效，不依赖真实密钥/服务
      ENVIRONMENT: ci
      DEBUG: "false"
      DASHSCOPE_API_KEY: ""
      MINERU_API_TOKEN: ""
      SECRET_KEY: "ci-only-secret-key-32-chars-padding!!"
      DATABASE_URL: "sqlite+aiosqlite:///./data/ci_test.db"
      REDIS_HOST: "localhost"
      MILVUS_HOST: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # pytest-cov 已在 requirements，但保险起见再确认一次
          pip install pytest-cov

      - name: Prepare data directory for SQLite
        run: mkdir -p data

      - name: Run pytest with coverage
        run: pytest -v

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 14

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 14

      - name: Coverage threshold check
        run: |
          # 阈值 35%（项目当前覆盖度，后续逐步提升）
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          line_rate = float(tree.getroot().attrib['line-rate'])
          pct = line_rate * 100
          print(f'Line coverage: {pct:.2f}%')
          assert pct >= 35, f'Coverage {pct:.2f}% < 35% threshold'
          "

  build:
    name: Docker Image Build (smoke)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: edu-agent-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify image starts
        run: |
          docker run --rm -d --name smoke-test \
            -e SECRET_KEY="smoke-test-secret-key-32-chars-pad" \
            -e DASHSCOPE_API_KEY="" \
            -e ENVIRONMENT=smoke \
            -p 8000:8000 \
            edu-agent-backend:ci
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/healthz | grep -q "200"
          docker stop smoke-test

  security:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for known CVEs
        run: pip-audit -r requirements.txt --strict --desc
        continue-on-error: true  # 项目敏感，发现漏洞只告警不阻断
