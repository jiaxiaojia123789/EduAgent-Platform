global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'eduagent-monitor'

scrape_configs:
  - job_name: 'eduagent'
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['eduagent-backend:8000']
        labels:
          service: 'eduagent-backend'
          env: 'production'
