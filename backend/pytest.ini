[pytest]
# asyncio_mode=auto：让 pytest-asyncio 自动把 async def test_X 当 async 测试跑
# 项目存量测试都是同步的，但教学图测试需要 async；放在 ini 文件避免 pyproject 兼容性问题
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
markers =
    integration: 集成测试（可能依赖外部服务）
    slow: 耗时较长的测试
    llm_required: 需要真实 LLM API Key 的测试
