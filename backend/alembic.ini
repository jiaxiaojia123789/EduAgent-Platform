# ============================================================
# Alembic 配置（数据库迁移工具）
# ============================================================
# 用法：
#   alembic revision --autogenerate -m "init schema"   # 生成迁移脚本
#   alembic upgrade head                                 # 应用到最新版本
#   alembic current                                      # 查看当前版本
#   alembic downgrade -1                                 # 回退一版
#   alembic history --verbose                            # 查看迁移历史
#
# 设计要点：
# - sqlalchemy.url 在 env.py 中从 settings.DATABASE_URL 动态注入，不在此硬编码
# - async URL（postgresql+asyncpg://）在 env.py 里转成 sync 版本以适配 alembic sync 接口
# - 生产环境迁移前必须 alembic upgrade head --sql > preview.sql 做预演
# ============================================================

[alembic]
# 默认 migrations 目录
script_location = alembic

# 版本表名（默认 alembic_version）
version_table = alembic_version

# 时间戳格式：YYYY_MM_DD_HHMM_<shortrev>
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 输出格式（python）避免 yaml 解析问题
output_encoding = utf-8

# 数据库 URL 在 env.py 里动态注入，此处占位
sqlalchemy.url = postgresql://postgres:password123@localhost:5432/edu_agent_db

[post_write_hooks]
# 自动用 ruff 格式化生成的迁移脚本
hooks = ruff_format
ruff_format.type = console_exec
ruff_format.executable = ruff
ruff_format.options = format $REVISION_FILE

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
